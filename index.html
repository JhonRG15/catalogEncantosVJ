<title>Encantos VJ — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --malva-profundo:#3A2440;
    --malva:#7D5B82;
    --dorado:#C6A87C;
    --crema:#EDE3DD;
    --negro:#0D0A0E;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--negro);
    color:var(--crema);
    font-family:'Jost', sans-serif;
    font-weight:300;
    letter-spacing:.01em;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    border-bottom:1px solid rgba(198,168,124,.35);
  }
  .hero-banner{
    width:100%;
    display:block;
    max-height:520px;
    object-fit:cover;
  }
  .hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(13,10,14,0) 55%, rgba(13,10,14,.95) 100%);
  }
  .hero-caption{
    position:absolute;
    left:0; right:0; bottom:22px;
    text-align:center;
    z-index:1;
  }
  .hero-caption .tagline{
    font-size:.72rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--dorado);
  }
  .logo-block{
    text-align:center;
    padding:44px 24px 34px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(125,91,130,.18), transparent 60%),
      var(--negro);
  }
  .monogram{
    width:120px;height:120px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(198,168,124,.4);
    box-shadow:0 0 0 6px rgba(198,168,124,.06);
  }
  .monogram img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(2rem, 5vw, 3rem);
    letter-spacing:.05em;
    color:var(--crema);
  }
  .brand em{
    font-style:italic;
    color:var(--dorado);
    font-weight:500;
  }
  .subtagline{
    margin-top:8px;
    font-size:.78rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--malva);
  }
  .hero-rule{
    width:64px;height:1px;
    background:var(--dorado);
    margin:22px auto 0;
  }

  /* ---------- FILTER NAV ---------- */
  .filter-bar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(13,10,14,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(198,168,124,.2);
    padding:16px 20px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:9px 18px;
    border:1px solid rgba(198,168,124,.35);
    border-radius:100px;
    font-family:'Jost', sans-serif;
    font-size:.78rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--crema);
    background:transparent;
    cursor:pointer;
    transition:.25s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--dorado);}
  .chip.active{
    background:var(--dorado);
    border-color:var(--dorado);
    color:var(--negro);
    font-weight:500;
  }

  /* ---------- CATALOG ---------- */
  .catalog{
    max-width:1240px;
    margin:0 auto;
    padding:48px 20px 100px;
  }
  .category-block{margin-bottom:56px;}
  .category-title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:1.8rem;
    color:var(--dorado);
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
  }
  .category-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(198,168,124,.4), transparent);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
  }

  .card{
    background:linear-gradient(180deg, rgba(125,91,130,.14), rgba(58,36,64,.22));
    border:1px solid rgba(198,168,124,.18);
    border-radius:4px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(198,168,124,.55);
  }

  .thumb{
    aspect-ratio:1/1;
    background:
      linear-gradient(135deg, rgba(198,168,124,.08), transparent),
      var(--malva-profundo);
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid rgba(198,168,124,.18);
    position:relative;
  }
  .thumb svg{width:38%;height:38%;opacity:.55;stroke:var(--dorado);}
  .thumb-label{
    position:absolute;
    bottom:8px;
    left:0; right:0;
    text-align:center;
    font-size:.62rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--malva);
  }

  .card-body{
    padding:16px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .card-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.12rem;
    line-height:1.28;
    color:var(--crema);
  }
  .card-sku{
    font-size:.66rem;
    letter-spacing:.08em;
    color:var(--malva);
    text-transform:uppercase;
  }
  .card-meta{
    font-size:.72rem;
    color:rgba(237,227,221,.55);
  }
  .card-footer{
    margin-top:auto;
    padding-top:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid rgba(198,168,124,.14);
  }
  .price{
    font-family:'Cormorant Garamond', serif;
    font-size:1.2rem;
    color:var(--dorado);
    font-weight:600;
  }
  .price small{
    display:block;
    font-family:'Jost', sans-serif;
    font-size:.58rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(198,168,124,.6);
    font-weight:400;
  }
  .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--dorado);
    color:var(--negro);
    text-decoration:none;
    flex-shrink:0;
    transition:.2s ease;
  }
  .wa-btn:hover{background:var(--crema);}
  .wa-btn svg{width:18px;height:18px;}

  /* ---------- FOOTER ---------- */
  .footer{
    text-align:center;
    padding:40px 20px 56px;
    border-top:1px solid rgba(198,168,124,.2);
  }
  .footer-brand{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--dorado);
    font-size:1.1rem;
    margin-bottom:10px;
  }
  .footer a{
    color:var(--crema);
    text-decoration:none;
    font-size:.85rem;
    letter-spacing:.04em;
    opacity:.75;
  }
  .footer a:hover{opacity:1;}

  @media (max-width:520px){
    .hero{padding:56px 18px 40px;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:14px;}
    .card-name{font-size:1rem;}
  }
</style>
</head>

const categories = [...new Set(products.map(p => p.cat))];
const money = n => "$" + n.toLocaleString("es-CO");

// ---- Render filtros ----
const filterBar = document.getElementById("filterBar");
categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "chip";
  btn.dataset.filter = cat;
  btn.textContent = cat;
  filterBar.appendChild(btn);
});

// ---- Render catálogo ----
const catalog = document.getElementById("catalog");

function waLink(p){
  const text = encodeURIComponent(`Hola, me interesa este producto:\n${p.name}${p.size ? " ("+p.size+")" : ""}\nSKU: ${p.sku}`);
  return `https://wa.me/${WHATSAPP}?text=${text}`;
}

function render(filter){
  catalog.innerHTML = "";
  const cats = filter === "all" ? categories : [filter];
  cats.forEach(cat => {
    const items = products.filter(p => p.cat === cat);
    if(!items.length) return;
    const block = document.createElement("section");
    block.className = "category-block";
    block.innerHTML = `<h2 class="category-title">${cat}</h2><div class="grid"></div>`;
    const grid = block.querySelector(".grid");
    items.forEach(p => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="thumb">
          <img
    src="${p.link}"
    alt="Imagen"
    style="width: 100%; height: 100%; object-fit: cover;"/>
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-sku">SKU ${p.sku}</div>
          ${p.size ? `<div class="card-meta">${p.size}</div>` : ""}
          <div class="card-footer">
            <div class="price"><small>Precio</small>${money(p.price)}</div>
            <a class="wa-btn" href="${waLink(p)}" target="_blank" rel="noopener" aria-label="Pedir por WhatsApp">${waIcon}</a>
          </div>
        </div>`;
      grid.appendChild(card);
    });
    catalog.appendChild(block);
  });
}

filterBar.addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if(!btn) return;
  filterBar.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.filter);
});

render("all");
</script>
</body>
</html>
