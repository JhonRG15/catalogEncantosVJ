name: Deploy HTML to Azure Web App - encantosvj

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_547DF02F09014978BA23D4C882BB3B46 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3036DAF27BF847D292C6FC69F66B35EC4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A51B0D74A5E3484B8F65FB18895A7EC4 }}

      - name: Deploy index.html
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'encantosvj'
          slot-name: 'Production'
          package: .
