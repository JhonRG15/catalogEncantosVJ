name: Deploy HTML to Azure Web App - encantosvj

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Azure credentials
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_547DF02F09014978BA23D4C882BB3B46 }}
          TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_3036DAF27BF847D292C6FC69F66B35EC }}
          SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A51B0D74A5E3484B8F65FB18895A7EC4 }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "CLIENT_ID está vacío"
            exit 1
          fi

          if [ -z "$TENANT_ID" ]; then
            echo "TENANT_ID está vacío"
            exit 1
          fi

          if [ -z "$SUBSCRIPTION_ID" ]; then
            echo "SUBSCRIPTION_ID está vacío"
            exit 1
          fi

          echo "CLIENT_ID encontrado"
          echo "TENANT_ID encontrado"
          echo "SUBSCRIPTION_ID encontrado"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_547DF02F09014978BA23D4C882BB3B46 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3036DAF27BF847D292C6FC69F66B35EC4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A51B0D74A5E3484B8F65FB18895A7EC4 }}

      - name: Deploy index.html
        uses: azure/webapps-deploy@v3
        with:
          app-name: encantosvj
          slot-name: Production
          package: .
